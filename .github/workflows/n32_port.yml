name: N32 Port CI

permissions:
  contents: read
  pull-requests: read

on:
  workflow_dispatch:
    inputs:
      sdk_url:
        description: Optional URL to a Nations N32H47x/48x SDK archive.
        required: false
        type: string
  push:
    branches:
    - 'N32移植'
    paths:
    - '.github/workflows/n32_port.yml'
    - 'keyboards/vendor/n32_devboard/**'
    - 'platforms/n32_freertos/**'
    - 'tmk_core/protocol/n32_freertos/**'
  pull_request:
    paths:
    - '.github/workflows/n32_port.yml'
    - 'keyboards/vendor/n32_devboard/**'
    - 'platforms/n32_freertos/**'
    - 'tmk_core/protocol/n32_freertos/**'

jobs:
  scope:
    name: Check N32-only scope
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Reject QMK core changes
      shell: bash
      run: |
        set -euo pipefail

        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          echo "Manual run: scope check skipped."
          exit 0
        fi

        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
        else
          base="${{ github.event.before }}"
          head="${{ github.sha }}"
        fi

        if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]]; then
          base="$(git rev-parse "$head^")"
        fi

        changed="$(git diff --name-only "$base" "$head")"
        printf '%s\n' "$changed"

        disallowed="$(printf '%s\n' "$changed" | grep -Ev '^(keyboards/vendor/n32_devboard/|platforms/n32_freertos/|tmk_core/protocol/n32_freertos/|\.github/workflows/n32_port\.yml$|$)' || true)"
        if [[ -n "$disallowed" ]]; then
          echo "Only N32 port files may be changed in this CI path:"
          printf '%s\n' "$disallowed"
          exit 1
        fi

  build:
    name: Build vendor/n32_devboard
    runs-on: ubuntu-latest
    needs: scope
    container: ghcr.io/qmk/qmk_cli
    env:
      N32_SDK_ARCHIVE_URL: ${{ inputs.sdk_url || secrets.N32_SDK_ARCHIVE_URL }}
      N32_SDK_ROOT: /f/N32/Nations.N32H47x_48x_Library.1.2.0

    steps:
    - name: Disable safe.directory check
      run: git config --global --add safe.directory '*'

    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Install Python dependencies
      run: pip3 install -r requirements-dev.txt

    - name: Prepare N32 SDK
      shell: bash
      run: |
        set -euo pipefail

        if [[ -z "${N32_SDK_ARCHIVE_URL}" ]]; then
          echo "N32_SDK_ARCHIVE_URL is not set."
          echo "Set repository secret N32_SDK_ARCHIVE_URL, or pass sdk_url when running workflow_dispatch."
          exit 1
        fi

        mkdir -p /f/N32 /tmp/n32-sdk
        curl -fsSL "${N32_SDK_ARCHIVE_URL}" -o /tmp/n32-sdk/archive

        python3 - <<'PY'
import pathlib
import shutil
import tarfile
import zipfile

archive = pathlib.Path("/tmp/n32-sdk/archive")
extract_root = pathlib.Path("/tmp/n32-sdk/extracted")
target = pathlib.Path("/f/N32/Nations.N32H47x_48x_Library.1.2.0")

if extract_root.exists():
    shutil.rmtree(extract_root)
extract_root.mkdir(parents=True)

if zipfile.is_zipfile(archive):
    with zipfile.ZipFile(archive) as zf:
        zf.extractall(extract_root)
elif tarfile.is_tarfile(archive):
    with tarfile.open(archive) as tf:
        tf.extractall(extract_root)
else:
    raise SystemExit("Unsupported SDK archive format. Use .zip, .tar, .tar.gz, or .tgz.")

matches = [
    path
    for path in extract_root.rglob("firmware/CMSIS/device/startup/startup_n32h47x_48x_gcc.s")
    if path.is_file()
]
if not matches:
    raise SystemExit("SDK archive does not contain firmware/CMSIS/device/startup/startup_n32h47x_48x_gcc.s")

sdk_root = matches[0].parents[4]
if target.exists():
    shutil.rmtree(target)
shutil.copytree(sdk_root, target)
print(f"Installed N32 SDK from {sdk_root} to {target}")
PY

        # n32_startup.S currently includes "F:/N32/..." for local Windows builds.
        # This symlink lets the same private port compile unchanged in Linux CI.
        ln -s /f "platforms/n32_freertos/F:"

    - name: Lint N32 keyboard metadata
      shell: bash
      run: qmk lint --strict --keyboard vendor/n32_devboard

    - name: Compile N32 devboard
      shell: bash
      run: qmk compile -kb vendor/n32_devboard -km default --parallel $(nproc)

    - name: Print firmware size
      if: always()
      shell: bash
      run: |
        if [[ -f .build/vendor_n32_devboard_default.elf ]]; then
          arm-none-eabi-size .build/vendor_n32_devboard_default.elf
        fi
